name: Production database backup

on:
  schedule:
    # Shifted off the original minute to resynchronize schedule delivery on merge.
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nanou-production-database-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    if: github.repository == 'pascalnanousympathie-alt/nanou-cyber-defense-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned backup crypto dependency
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.2"

      - name: Validate backup recipient key
        shell: bash
        run: |
          set -euo pipefail
          test -s backups/production-backup-public.pem
          python - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          key = serialization.load_pem_public_key(
              Path("backups/production-backup-public.pem").read_bytes()
          )
          import hashlib

          if not isinstance(key, rsa.RSAPublicKey) or key.key_size < 3072:
              raise SystemExit("Production backup recipient key must be RSA-3072 or stronger.")
          der = key.public_bytes(
              encoding=serialization.Encoding.DER,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          fingerprint = hashlib.sha256(der).hexdigest()
          expected = "f5cb681b49a315ee94dccf420fdef26b92ac002c723f85544a0b5dd77b6fa7c1"
          if fingerprint != expected:
              raise SystemExit("Production backup public-key fingerprint does not match the offline key.")
          print("Backup recipient key validated.")
          PY

      - name: Dump Production PostgreSQL with the read-only backup role
        shell: bash
        # Keep the read-only database secret scoped to this step only.
        env:
          DATABASE_URL: ${{ secrets.NANOU_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL}"
          umask 077
          install -d -m 700 "${RUNNER_TEMP}/nanou-prod-backup"

          # Parse the URI without exposing it in Docker or pg_dump argv.
          connection_env="$(mktemp "${RUNNER_TEMP}/nanou-pg-env.XXXXXX")"
          chmod 600 "$connection_env"
          PYTHONPATH=src python scripts/write_postgres_libpq_env.py --output "$connection_env"
          set -a
          source "$connection_env"
          set +a
          rm -f "$connection_env"
          unset DATABASE_URL

          # Fail closed if the configured credential is not the dedicated backup identity.
          if [[ "${PGUSER}" != "nanou_backup" ]]; then
            echo "::error::Production backups require the dedicated nanou_backup role."
            exit 1
          fi

          docker run --rm \
            --entrypoint sh \
            --user "$(id -u):$(id -g)" \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE \
            --env PGUSER \
            --env PGPASSWORD \
            --env PGSSLMODE \
            --env PGCHANNELBINDING \
            --env PGAPPNAME \
            --env PGCONNECT_TIMEOUT \
            --env PGTARGETSESSIONATTRS \
            --volume "${RUNNER_TEMP}/nanou-prod-backup:/backup" \
            postgres:17-alpine \
            -ec '
              umask 077
              psql -X -v ON_ERROR_STOP=1 -Atqc "
                SELECT 1
                FROM pg_roles
                WHERE rolname = current_user
                  AND rolname = '\''nanou_backup'\''
                  AND NOT (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls)
                  AND NOT has_database_privilege(current_user, current_database(), '\''CREATE'\'')
                  AND NOT has_schema_privilege(current_user, '\''public'\'', '\''CREATE'\'')
                  AND has_schema_privilege(current_user, '\''public'\'', '\''USAGE'\'')
                  AND NOT EXISTS (
                    SELECT 1
                    FROM pg_class AS r
                    JOIN pg_namespace AS n ON n.oid = r.relnamespace
                    WHERE n.nspname = '\''public'\''
                      AND r.relkind IN ('\''r'\'', '\''p'\'')
                      AND (r.relrowsecurity OR r.relforcerowsecurity)
                  )
                  AND NOT EXISTS (
                    SELECT 1
                    FROM pg_class AS s
                    JOIN pg_namespace AS n ON n.oid = s.relnamespace
                    WHERE n.nspname = '\''public'\''
                      AND s.relkind = '\''S'\''
                      AND NOT has_sequence_privilege(current_user, s.oid, '\''SELECT'\'')
                  )
                  AND NOT EXISTS (
                    SELECT 1
                    FROM pg_roles AS granted_role
                    WHERE granted_role.rolname <> current_user
                      AND pg_has_role(current_user, granted_role.oid, '\''MEMBER'\'')
                  )
                  AND NOT EXISTS (
                    SELECT 1
                    FROM pg_class AS c
                    JOIN pg_namespace AS n ON n.oid = c.relnamespace
                    WHERE n.nspname = '\''public'\''
                      AND c.relkind IN ('\''r'\'', '\''p'\'', '\''v'\'', '\''m'\'', '\''f'\'')
                      AND (
                        has_table_privilege(current_user, c.oid, '\''INSERT'\'')
                        OR has_table_privilege(current_user, c.oid, '\''UPDATE'\'')
                        OR has_table_privilege(current_user, c.oid, '\''DELETE'\'')
                        OR has_table_privilege(current_user, c.oid, '\''TRUNCATE'\'')
                        OR has_table_privilege(current_user, c.oid, '\''REFERENCES'\'')
                        OR has_table_privilege(current_user, c.oid, '\''TRIGGER'\'')
                      )
                  )
                  AND NOT EXISTS (
                    SELECT 1
                    FROM pg_class AS s
                    JOIN pg_namespace AS n ON n.oid = s.relnamespace
                    WHERE n.nspname = '\''public'\''
                      AND s.relkind = '\''S'\''
                      AND (
                        has_sequence_privilege(current_user, s.oid, '\''USAGE'\'')
                        OR has_sequence_privilege(current_user, s.oid, '\''UPDATE'\'')
                      )
                  )
              " | grep -qx 1
              pg_dump --format=custom --schema=public --no-owner --no-privileges --file=/backup/production.dump
              pg_restore --list /backup/production.dump >/dev/null
            '
          echo "Production database dump completed and archive index validated."

      - name: Encrypt dump with RSA-OAEP-SHA256 and AES-256-GCM
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          output="${RUNNER_TEMP}/nanou-prod-backup/nanou-production-${stamp}.ncdb"
          PYTHONPATH=src python scripts/encrypt_production_backup.py \
            --input "${RUNNER_TEMP}/nanou-prod-backup/production.dump" \
            --public-key backups/production-backup-public.pem \
            --output "$output"
          (cd "$(dirname "$output")" && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")
          printf '%s' "created_utc=$stamp" > "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          echo >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          printf '%s' "encryption=RSA-3072-OAEP-SHA256+AES-256-GCM" >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          echo >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          printf '%s' "retention_days=30" >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          echo >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          shred -u "${RUNNER_TEMP}/nanou-prod-backup/production.dump" 2>/dev/null || rm -f "${RUNNER_TEMP}/nanou-prod-backup/production.dump"
          test ! -e "${RUNNER_TEMP}/nanou-prod-backup/production.dump"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanou-production-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nanou-prod-backup/*.ncdb
            ${{ runner.temp }}/nanou-prod-backup/*.sha256
            ${{ runner.temp }}/nanou-prod-backup/manifest.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
