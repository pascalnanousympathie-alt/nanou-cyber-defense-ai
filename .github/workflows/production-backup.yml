name: Production database backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nanou-production-database-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    if: github.repository == 'pascalnanousympathie-alt/nanou-cyber-defense-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned backup crypto dependency
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.2"

      - name: Validate backup recipient key
        shell: bash
        run: |
          set -euo pipefail
          test -s backups/production-backup-public.pem
          python - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          key = serialization.load_pem_public_key(
              Path("backups/production-backup-public.pem").read_bytes()
          )
          import hashlib

          if not isinstance(key, rsa.RSAPublicKey) or key.key_size < 3072:
              raise SystemExit("Production backup recipient key must be RSA-3072 or stronger.")
          der = key.public_bytes(
              encoding=serialization.Encoding.DER,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          fingerprint = hashlib.sha256(der).hexdigest()
          expected = "f5cb681b49a315ee94dccf420fdef26b92ac002c723f85544a0b5dd77b6fa7c1"
          if fingerprint != expected:
              raise SystemExit("Production backup public-key fingerprint does not match the offline key.")
          print("Backup recipient key validated.")
          PY

      - name: Dump Production PostgreSQL with the read-only backup role
        shell: bash
        # Keep the read-only database secret scoped to this step only.
        env:
          DATABASE_URL: ${{ secrets.NANOU_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL}"
          umask 077
          install -d -m 700 "${RUNNER_TEMP}/nanou-prod-backup"

          # Parse the URI into libpq environment variables. Never pass the URI
          # itself in Docker or pg_dump argv, where process listings could expose it.
          connection_env="$(mktemp "${RUNNER_TEMP}/nanou-pg-env.XXXXXX")"
          chmod 600 "$connection_env"
          python - "$connection_env" <<'PY'
          import os
          import shlex
          import sys
          from urllib.parse import parse_qs, unquote, urlsplit

          parsed = urlsplit(os.environ["DATABASE_URL"])
          if parsed.scheme not in {"postgres", "postgresql"} or not parsed.hostname:
              raise SystemExit("NANOU_BACKUP_DATABASE_URL must be a PostgreSQL URI.")
          if not parsed.username or parsed.password is None or not parsed.path.strip("/"):
              raise SystemExit("Backup database URI must include a username, password and database.")
          query = parse_qs(parsed.query, keep_blank_values=True)
          supported = {
              "sslmode": "PGSSLMODE",
              "channel_binding": "PGCHANNELBINDING",
              "application_name": "PGAPPNAME",
              "options": "PGOPTIONS",
              "connect_timeout": "PGCONNECT_TIMEOUT",
              "target_session_attrs": "PGTARGETSESSIONATTRS",
          }
          unsupported = sorted(set(query) - set(supported))
          if unsupported:
              raise SystemExit(
                  "Unsupported PostgreSQL URI query options: " + ", ".join(unsupported)
              )
          sslmode = query.get("sslmode", ["require"])[-1]
          if sslmode not in {"require", "verify-ca", "verify-full"}:
              raise SystemExit("PostgreSQL backup connections must require TLS.")
          values = {
              "PGHOST": parsed.hostname,
              "PGPORT": str(parsed.port or 5432),
              "PGDATABASE": unquote(parsed.path.lstrip("/")),
              "PGUSER": unquote(parsed.username),
              "PGPASSWORD": unquote(parsed.password),
              "PGSSLMODE": sslmode,
          }
          for option, environment_name in supported.items():
              if option in query:
                  values[environment_name] = query[option][-1]
          if any("\0" in value for value in values.values()):
              raise SystemExit("PostgreSQL connection settings contain an invalid NUL byte.")
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"export {key}={shlex.quote(value)}")
                  output.write(chr(10))
          PY
          set -a
          source "$connection_env"
          set +a
          rm -f "$connection_env"
          unset DATABASE_URL

          docker run --rm \
            --entrypoint sh \
            --user "$(id -u):$(id -g)" \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE \
            --env PGUSER \
            --env PGPASSWORD \
            --env PGSSLMODE \
            --env PGCHANNELBINDING \
            --env PGAPPNAME \
            --env PGOPTIONS \
            --env PGCONNECT_TIMEOUT \
            --env PGTARGETSESSIONATTRS \
            --volume "${RUNNER_TEMP}/nanou-prod-backup:/backup" \
            postgres:17-alpine \
            -ec 'umask 077; pg_dump --format=custom --no-owner --no-privileges --file=/backup/production.dump && pg_restore --list /backup/production.dump >/dev/null'
          echo "Production database dump completed and archive index validated."

      - name: Encrypt dump with RSA-OAEP-SHA256 and AES-256-GCM
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          output="${RUNNER_TEMP}/nanou-prod-backup/nanou-production-${stamp}.ncdb"
          PYTHONPATH=src python scripts/encrypt_production_backup.py \
            --input "${RUNNER_TEMP}/nanou-prod-backup/production.dump" \
            --public-key backups/production-backup-public.pem \
            --output "$output"
          sha256sum "$output" > "$output.sha256"
          printf '%s' "created_utc=$stamp" > "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          echo >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          printf '%s' "encryption=RSA-3072-OAEP-SHA256+AES-256-GCM" >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          echo >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          printf '%s' "retention_days=30" >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          echo >> "${RUNNER_TEMP}/nanou-prod-backup/manifest.txt"
          shred -u "${RUNNER_TEMP}/nanou-prod-backup/production.dump" 2>/dev/null || rm -f "${RUNNER_TEMP}/nanou-prod-backup/production.dump"
          test ! -e "${RUNNER_TEMP}/nanou-prod-backup/production.dump"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanou-production-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nanou-prod-backup/*.ncdb
            ${{ runner.temp }}/nanou-prod-backup/*.sha256
            ${{ runner.temp }}/nanou-prod-backup/manifest.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
