name: Security scans

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/web-platform
      - fix/admin-password-rotation
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks secret-history scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_VERSION: "8.30.1"
      - name: Scan all fetched Git refs and commit history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_bin="/tmp/gitleaks-8.30.1/gitleaks"
          if [ ! -x "$gitleaks_bin" ]; then
            echo "::error::Pinned Gitleaks binary is missing after the official action completed."
            exit 1
          fi
          "$gitleaks_bin" git --redact --no-banner --no-color --timeout 600 --log-opts="--all --no-merges"

  codeql-python:
    name: CodeQL python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: python
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4

  codeql-javascript-typescript:
    name: CodeQL javascript-typescript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Detect non-empty JavaScript/TypeScript source files
        id: source
        shell: bash
        run: |
          set -euo pipefail
          has_sources="$(python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          extensions = {".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx"}
          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.split(b"\\0")
          found = False
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(os.fsdecode(raw_path))
              if path.suffix.lower() not in extensions or not path.is_file():
                  continue
              with path.open("rb") as source_file:
                  if source_file.read(4096).strip():
                      found = True
                      break
          print("true" if found else "false")
          PY
          )"
          echo "has_sources=$has_sources" >> "$GITHUB_OUTPUT"
          if [ "$has_sources" = "true" ]; then
            echo "Non-empty JavaScript/TypeScript sources found; CodeQL will run."
          else
            echo "No non-empty JavaScript/TypeScript sources are tracked; CodeQL scan is not applicable on this ref."
          fi
      - name: Initialize CodeQL
        if: steps.source.outputs.has_sources == 'true'
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        if: steps.source.outputs.has_sources == 'true'
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
